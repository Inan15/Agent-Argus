[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "argus-agent"
version = "0.1.0"
description = "ArgusAgent: Agent-First Deterministic Repository Assurance & Audit Engine. Argus's own finding precision has not been independently validated."
readme = "README.md"
authors = [
    { name = "Minions & Argus Agent Team" }
]
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "jsonschema>=4.0",
    "radon>=4.1.0",
    "httpx>=0.24.0",
    # STRUCK 2026-08-12 (Story 11.4) — the claim below was measured and is FALSE as
    # written. Original kept legible per architecture.md §3.4 evidence immutability:
    #   ~~"On 0.26.0 the cartridge self-audit flips NOT_READY_FOR_RELEASE -> RELEASE_READY
    #     (AST corroboration stops firing)."~~
    # CORRECTION, measured 2026-08-12: NOT REPRODUCIBLE as stated, two ways. (a) Upstream
    # 0.26.0's breaking changes are Language.version->abi_version, Language.query()->
    # Query(...), the two timeout_micros removals, and Point becoming a tuple subclass;
    # Argus uses none of them and the minimum grammar ABI is unchanged. (b) When AST
    # extraction is made to fail totally, the cartridges land on INSUFFICIENT_COVERAGE /
    # exit 3 (the coverage floor fires first), never RELEASE_READY — and the cartridge
    # corpus sits at deep 1/2 = 50%, below the 60% gate, so it is structurally incapable
    # of the stated flip.
    # The bound is RETAINED as conservative-by-default: 0.26 is unproven here, not proven
    # safe, and widening it is a packaging decision owned by 12.5 / the operator (NFR-P3).
    # STORY 12.5 DECIDED (2026-08-15): the bound STAYS. NFR-P3 is about which grammars the
    # default install carries, not about how wide the core's supported range is, and 11.4's
    # evidence for the bound is unchanged — widening it would ship an untested toolchain
    # range under cover of a packaging story. The `<0.26` ceiling is one fact with one
    # source (`grammar_status.SUPPORTED_CORE_RANGE`, pinned both ways by
    # `TC-ArgusAgent-DOCS-001-54`); the operator half of this decision is unaffected.
    # What now carries the guarantee is a RUNTIME defence, because a metadata bound
    # constrains a resolver and constrains nothing on a machine where the package is
    # already installed, pinned, vendored or patched: argus/index/ast_index.py's ARM 5
    # parses a per-language behavioural canary through the real loader seam and withholds
    # the parser when the toolchain does not extract what Argus was validated against
    # (argus/shared/grammar_status.py, tests/test_grammar_runtime_validation.py).
    "tree-sitter>=0.25.0,<0.26",
    # ── The ten grammars, in the DEFAULT install (Story 12.5, 2026-08-15 / NFR-P3) ──
    # The nine non-Python grammars were an optional `[languages]` extra until this change, so
    # `pip install argus-agent` grounded Python only: a Go or TypeScript repository enumerated
    # and graded, no file in it could reach `audited_deep`, and the operator was handed a lower
    # coverage ratio that reads as a judgement about their code. NFR-P3 classifies that as a
    # PACKAGING DEFECT, not a user error, so the fix is here rather than in an install
    # instruction the user has to find. `[project.optional-dependencies] languages` below is
    # RETAINED as a backward-compatibility alias and is pinned equal to these lines by
    # `TC-ArgusAgent-DOCS-001-61`, which also derives the expected set from
    # `argus/shared/grammar_status.py::GRAMMAR_PACKAGE_BY_LANGUAGE` — so an eleventh language
    # added to the tool and not to this list fails at edit time rather than in someone's audit.
    # The specifiers are UNCHANGED by the promotion: each is exactly what the extra already
    # declared, because a promotion that also moves a bound is two changes wearing one review.
    "tree-sitter-python>=0.25.0,<0.26",
    "tree-sitter-javascript>=0.25.0,<0.26",
    "tree-sitter-typescript>=0.23.0,<0.26",
    "tree-sitter-go>=0.23.0,<0.26",
    "tree-sitter-rust>=0.23.0,<0.26",
    "tree-sitter-java>=0.23.0,<0.26",
    "tree-sitter-c>=0.23.0,<0.26",
    "tree-sitter-cpp>=0.23.0,<0.26",
    "tree-sitter-ruby>=0.23.0,<0.26",
    "tree-sitter-php>=0.23.0,<0.26",
]

[tool.flit.module]
name = "argus"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio",
    "pytest-cov",
    "mypy>=1.0",
    # ── The BUILT-ARTIFACT tooling (added 2026-08-16, CI run 31895158449) ──
    # `tests/test_built_distribution.py` builds a real wheel + sdist and measures them; where
    # the tooling is absent it reports `Unevaluable(E6)` and SKIPS rather than passing on a
    # question it could not put. On CI neither package was installed, so the whole file skipped
    # on every run and `-24` — "a permanently skipped guard is a guard nobody runs" — went red.
    # It is red about the ENVIRONMENT, not about the code, so the fix belongs here: the extra
    # that declares what it takes to run this suite now declares this too.
    #
    # `flit_core` is needed as well as `build`, and its absence is the less obvious half: pip
    # resolves `[build-system] requires` into an ISOLATED build environment, so it never lands
    # in the environment the tests run in — and the build here is deliberately `--no-isolation`
    # (a test suite in this project may not reach the network). The specifier is held equal to
    # `[build-system] requires` by `TC-ArgusAgent-RELEASE-001-24`, so this cannot become a
    # second source of truth about which backend version this project builds with.
    "build>=1.0",
    "flit_core >=3.2,<4",
]
llm = [
    "litellm>=1.0.0",
]
# RETAINED BACKWARD-COMPATIBILITY ALIAS (Story 12.5, 2026-08-15 / NFR-P3). These nine are now
# ordinary `[project.dependencies]` above, so this extra adds NOTHING to a default install. It
# is kept — not deleted — because Story 10.2 documented it publicly and
# `pip install "argus-agent[languages]"` therefore exists in somebody's script; removing the
# extra would turn that into a resolver error for no benefit. Every line here must appear
# verbatim in `dependencies` above (asserted by `TC-ArgusAgent-DOCS-001-61`): if the two lists
# could differ, this one would be a second source of truth about what a user gets.
#
# ~~Deep auditing beyond Python needs the matching tree-sitter grammar installed. Without one,
# a repository in that language still enumerates and grades, but no file can reach
# `audited_deep` — the report says so explicitly and names the package.~~ (Struck 2026-08-15:
# the first sentence described the extra as load-bearing, which it no longer is. The second
# remains TRUE of a grammar that is missing at run time anyway, and is now stated where it
# matters — the report names the file, the depth it reached, the package and the `pip install`
# command at the point of downgrade.)
languages = [
    "tree-sitter-javascript>=0.25.0,<0.26",
    "tree-sitter-typescript>=0.23.0,<0.26",
    "tree-sitter-go>=0.23.0,<0.26",
    "tree-sitter-rust>=0.23.0,<0.26",
    "tree-sitter-java>=0.23.0,<0.26",
    "tree-sitter-c>=0.23.0,<0.26",
    "tree-sitter-cpp>=0.23.0,<0.26",
    "tree-sitter-ruby>=0.23.0,<0.26",
    "tree-sitter-php>=0.23.0,<0.26",
]

[project.scripts]
argus = "argus.cli:main"
argus-agent = "argus.cli:main"
repo-audit = "argus.cli:main"
# ── The FR35 agent-integration entry point (Story 12.6, 2026-08-15) ──
# EXACTLY ONE new alias, in the SAME distribution: same version, same release workflow,
# same gate evidence. It is not a separate channel, not a new extra, and it adds NO
# dependency — the JSON-RPC layer is stdlib-only, because the official `mcp` SDK declares
# `starlette`/`uvicorn`/`sse-starlette` as REQUIRED and would break the
# `argus.* ⊬ fastapi/uvicorn/starlette` isolation gate (ADR #20) that this surface's own
# constraints require to keep passing. It speaks stdio only: no port is bound.
argus-mcp = "argus.mcp.server:main"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
