[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "argus-agent"
version = "0.1.0"
description = "ArgusAgent: Agent-First Deterministic Repository Assurance & Audit Engine"
readme = "README.md"
authors = [
    { name = "Minions & Argus Agent Team" }
]
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "jsonschema>=4.0",
    "radon>=4.1.0",
    "httpx>=0.24.0",
    # Upper bound is load-bearing, not hygiene: architecture AR1 sanctions
    # tree-sitter 0.25.x and folds the grammar version into the Epic-5 determinism
    # cache key. On 0.26.0 the cartridge self-audit flips
    # NOT_READY_FOR_RELEASE -> RELEASE_READY (AST corroboration stops firing), i.e.
    # a false-negative verdict from an assurance tool. Do not widen without
    # re-running tests/test_cartridge_selfaudit.py.
    "tree-sitter>=0.25.0,<0.26",
    "tree-sitter-python>=0.25.0,<0.26",
]

[tool.flit.module]
name = "argus"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio",
    "pytest-cov",
    "mypy>=1.0",
]
llm = [
    "litellm>=1.0.0",
]
# Deep auditing beyond Python needs the matching tree-sitter grammar installed.
# Without one, a repository in that language still enumerates and grades, but no file
# can reach `audited_deep` — the report says so explicitly and names the package.
# Pinned to the same 0.25.x line as the core grammar for the AR1 reason documented above.
languages = [
    "tree-sitter-javascript>=0.25.0,<0.26",
    "tree-sitter-typescript>=0.23.0,<0.26",
    "tree-sitter-go>=0.23.0,<0.26",
    "tree-sitter-rust>=0.23.0,<0.26",
    "tree-sitter-java>=0.23.0,<0.26",
    "tree-sitter-c>=0.23.0,<0.26",
    "tree-sitter-cpp>=0.23.0,<0.26",
    "tree-sitter-ruby>=0.23.0,<0.26",
    "tree-sitter-php>=0.23.0,<0.26",
]

[project.scripts]
argus = "argus.cli:main"
argus-agent = "argus.cli:main"
repo-audit = "argus.cli:main"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
