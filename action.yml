name: "ArgusAgent Code Audit & Release Gate"
description: "Agent-first deterministic code audit, vacuous test detector, and secret scanner for student repositories. Argus's finding precision has not been independently validated."
author: "ArgusAgent Team"
branding:
  icon: "shield"
  color: "blue"

inputs:
  repo-path:
    description: "Path to the repository root directory."
    required: false
    default: "."
  commit-sha:
    description: "Commit SHA to pin for audit verification."
    required: false
    default: "${{ github.sha }}"
  report-dir:
    description: "Directory path where Markdown audit reports will be written."
    required: false
    default: "./argus-reports"
  strict:
    # DELIBERATELY advisory by default (Story 9.2 / AC10). Assumption A5 is UNSUPPORTED:
    # after the FR16/FR4 amendment a first-time consumer is expected to land on exit `3`
    # (INSUFFICIENT_COVERAGE), which already fails any gate configured to block. Flipping
    # this default to "true" here would pre-empt a policy decision that belongs to the
    # downstream integration (handoff H3), not to the action's author.
    description: "If 'true', fails the workflow if the audit did not return exit 0 (i.e. NOT_READY_FOR_RELEASE, INSUFFICIENT_COVERAGE, or a typed audit failure)."
    required: false
    default: "false"

outputs:
  verdict:
    # The verdict tokens are ASSESSMENTS. AUDIT_FAILED is deliberately NOT one of them:
    # it means no verdict was produced at all, which is a different kind of statement.
    description: >-
      Audit outcome token. One of the three verdict values the audit can assess —
      RELEASE_READY (exit 0), NOT_READY_FOR_RELEASE (exit 2), INSUFFICIENT_COVERAGE
      (exit 3) — or AUDIT_FAILED, which is NOT a verdict: it means the audit did not
      complete and no assessment exists (exit 1, the AR10 typed-failure code, or any
      future/unmapped exit code). A consumer must never read AUDIT_FAILED as a
      ran-and-under-covered result.
    value: ${{ steps.run_audit.outputs.verdict }}
  exit-code:
    description: >-
      Exit code of the Argus audit. The complete wire contract is
      0=RELEASE_READY, 2=NOT_READY_FOR_RELEASE, 3=INSUFFICIENT_COVERAGE,
      1=typed audit failure (no verdict produced — AR10). Any other value is
      unmapped and is reported as AUDIT_FAILED, never as a verdict.
    value: ${{ steps.run_audit.outputs.exit_code }}
  assessed:
    # The single boolean a blocking gate should key on when it wants "did the tool
    # actually assess this repository?" — separable from "what did it assess?".
    description: "'true' if the audit produced a verdict (exit 0/2/3); 'false' if it did not (AUDIT_FAILED)."
    value: ${{ steps.run_audit.outputs.assessed }}

runs:
  using: "composite"
  steps:
    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    # ── EVERY VALUE REACHING A SHELL IS BOUND THROUGH `env:` (Story 11.3, ledger item DF-9-2-D) ──
    # A `${{ }}` expression is expanded by the runner INTO THE SHELL SOURCE TEXT before bash parses
    # it, so an interpolated value is CODE, not data. This file is the one a CONSUMER's job runs,
    # and its `strict`/`repo-path`/`commit-sha`/`report-dir` inputs are values a consumer's
    # workflow author supplies — in practice frequently `${{ github.event.* }}`, GitHub's
    # documented untrusted surface. The rule applied below is the one
    # `.github/workflows/release.yml:39-47` already states for this repository, and it has two
    # halves that must not be separated: (1) bind through a step-level `env:` map; (2) reference it
    # as a DOUBLE-QUOTED shell variable, because an env-bound but unquoted `$REPORT_DIR` merely
    # trades injection for word-splitting and glob expansion. Enforced by
    # `tests/test_workflow_input_containment.py`, which fails on the next interpolation anybody
    # writes into a `run:` body — anywhere in the committed corpus, not just here.
    #
    # `github.action_path` below is runner-provided and was never consumer-settable, so it is not
    # the defect; it is bound anyway (Story 11.3 / DN-3) so that the published artifact carries the
    # stronger claim — ZERO interpolations inside any `run:` body, with no exemption registered
    # against the file a consumer executes.
    - name: ⚡ Install ArgusAgent
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        python -m pip install --upgrade pip
        pip install "$ACTION_PATH"[languages]

    - name: 🔍 Execute Argus Audit Engine
      id: run_audit
      shell: bash
      env:
        REPO_PATH: ${{ inputs.repo-path }}
        COMMIT_SHA: ${{ inputs.commit-sha }}
        REPORT_DIR: ${{ inputs.report-dir }}
        STRICT: ${{ inputs.strict }}
      run: |
        mkdir -p "$REPORT_DIR"
        
        # Run audit and record exit code
        set +e
        argus audit "$REPO_PATH" \
          --commit "$COMMIT_SHA" \
          --report-dir "$REPORT_DIR"
        EXIT_CODE=$?
        set -e
        
        echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

        # ── THE COMPLETE EXIT-CODE MAP (Story 9.2 / AC10, ledger item DF-8-4-A) ──
        # The wire contract is {0, 2, 3, 1, anything else}. Every arm is explicit and the
        # catch-all maps to a FAILURE token, never to a verdict token.
        #
        # Before this change the map was `0 -> RELEASE_READY / 2 -> NOT_READY_FOR_RELEASE
        # / else -> INSUFFICIENT_COVERAGE`, so exit 1 — the AR10 typed-failure code, which
        # means NO VERDICT WAS PRODUCED — was republished as INSUFFICIENT_COVERAGE, a
        # ran-and-under-covered ASSESSMENT. Under the amended canonical vocabulary
        # INSUFFICIENT_COVERAGE is a not-assessed state, so a crash read to a consumer as
        # a completed audit: an over-claim in exactly the direction Epic 8 exists to
        # remove. An unmapped FUTURE exit code hit the same `else` and would have done
        # the same thing, which is why the catch-all is a failure token and not a guess.
        #
        # ── WHAT `2` MEANS, AND WHAT IT CANNOT MEAN (Story 12.8 / AC8, 2026-08-15) ──
        # This comment reasoned at length about `1` and the catch-all and said NOTHING about a
        # USAGE error, and that silence was load-bearing: until 2026-08-15 every argparse usage
        # error exited `2` — `argus audit . --budget 1.5`, `argus bogus`, a bare `argus` — and
        # this map published `2` as `verdict=NOT_READY_FOR_RELEASE assessed=true`. A TYPO
        # therefore produced a fabricated assessment of a repository for a run that never
        # happened, which is the same class of over-claim the paragraph above removed from `1`,
        # arriving through the one arm nobody had looked at.
        #
        # `argus.cli:main` now maps a parser rejection to `1` — the reserved *no verdict was
        # produced* code — so BOTH halves of the wire contract are honest here with no change
        # to this file's logic and no fifth exit code (AR3 is frozen; NFR-M2 is additive-only).
        # The binding statement, restated so the next reader does not have to infer it:
        #
        #   `2` means, and can only mean, THE AUDIT RAN AND FOUND AT LEAST ONE VERDICT-BLOCKING
        #   FINDING. It is never emitted for a command line the parser refused.
        #
        # `--help` / `-h` still exits `0` and is not mapped, so a workflow smoke-testing the
        # command is unaffected.
        #
        # `assessed` is published separately so a consuming workflow can distinguish
        # "the audit ran and says X" from "the audit did not run" without string-matching.
        case "$EXIT_CODE" in
          0)
            echo "verdict=RELEASE_READY" >> $GITHUB_OUTPUT
            echo "assessed=true" >> $GITHUB_OUTPUT
            ;;
          2)
            echo "verdict=NOT_READY_FOR_RELEASE" >> $GITHUB_OUTPUT
            echo "assessed=true" >> $GITHUB_OUTPUT
            ;;
          3)
            echo "verdict=INSUFFICIENT_COVERAGE" >> $GITHUB_OUTPUT
            echo "assessed=true" >> $GITHUB_OUTPUT
            ;;
          1)
            echo "verdict=AUDIT_FAILED" >> $GITHUB_OUTPUT
            echo "assessed=false" >> $GITHUB_OUTPUT
            echo "::error::Argus exited 1 (AR10 typed failure): the audit did not complete and NO verdict was produced. This is not an assessment of this repository."
            ;;
          *)
            echo "verdict=AUDIT_FAILED" >> $GITHUB_OUTPUT
            echo "assessed=false" >> $GITHUB_OUTPUT
            echo "::error::Argus exited with the unmapped code $EXIT_CODE. No verdict is claimed for this run."
            ;;
        esac

        if [ "$STRICT" = "true" ] && [ "$EXIT_CODE" -ne 0 ]; then
          echo "❌ Argus Release Gate failed with exit code $EXIT_CODE"
          exit $EXIT_CODE
        fi

    - name: 📦 Upload Audit Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: argus-audit-reports
        path: ${{ inputs.report-dir }}
        retention-days: 14
