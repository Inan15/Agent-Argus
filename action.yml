name: "ArgusAgent Code Audit & Release Gate"
description: "Agent-first deterministic code audit, vacuous test detector, and secret scanner for student repositories."
author: "ArgusAgent Team"
branding:
  icon: "shield"
  color: "blue"

inputs:
  repo-path:
    description: "Path to the repository root directory."
    required: false
    default: "."
  commit-sha:
    description: "Commit SHA to pin for audit verification."
    required: false
    default: "${{ github.sha }}"
  report-dir:
    description: "Directory path where Markdown audit reports will be written."
    required: false
    default: "./argus-reports"
  strict:
    description: "If 'true', fails the workflow if release readiness is NOT_READY_FOR_RELEASE or INSUFFICIENT_COVERAGE."
    required: false
    default: "false"

outputs:
  verdict:
    description: "Audit release readiness verdict token (RELEASE_READY, NOT_READY_FOR_RELEASE, INSUFFICIENT_COVERAGE)."
    value: ${{ steps.run_audit.outputs.verdict }}
  exit-code:
    description: "Exit code of the Argus audit (0=Pass, 2=Fail, 3=Insufficient Coverage)."
    value: ${{ steps.run_audit.outputs.exit_code }}

runs:
  using: "composite"
  steps:
    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: ⚡ Install ArgusAgent
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install "${{ github.action_path }}"[languages]

    - name: 🔍 Execute Argus Audit Engine
      id: run_audit
      shell: bash
      run: |
        mkdir -p "${{ inputs.report-dir }}"
        
        # Run audit and record exit code
        set +e
        argus audit "${{ inputs.repo-path }}" \
          --commit "${{ inputs.commit-sha }}" \
          --report-dir "${{ inputs.report-dir }}"
        EXIT_CODE=$?
        set -e
        
        echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
        
        if [ "$EXIT_CODE" -eq 0 ]; then
          echo "verdict=RELEASE_READY" >> $GITHUB_OUTPUT
        elif [ "$EXIT_CODE" -eq 2 ]; then
          echo "verdict=NOT_READY_FOR_RELEASE" >> $GITHUB_OUTPUT
        else
          echo "verdict=INSUFFICIENT_COVERAGE" >> $GITHUB_OUTPUT
        fi
        
        if [ "${{ inputs.strict }}" = "true" ] && [ "$EXIT_CODE" -ne 0 ]; then
          echo "❌ Argus Release Gate failed with exit code $EXIT_CODE"
          exit $EXIT_CODE
        fi

    - name: 📦 Upload Audit Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: argus-audit-reports
        path: ${{ inputs.report-dir }}
        retention-days: 14
