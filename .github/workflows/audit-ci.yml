name: ArgusAgent Repository Audit & Assurance CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  audit-assurance-ci:
    name: Run Argus Quality Gates & Audit Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # FULL history, not the default depth-1 shallow clone (added 2026-08-16 after CI
          # run 31895158449). Four guards in this suite ask questions of the REPOSITORY'S
          # HISTORY and cannot answer them from a single commit — they were red on every CI
          # run and green on every developer machine, which is the worst possible split:
          #
          #   * tests/test_dogfood_artifact_currency.py -49 resolves the provenance sha each
          #     committed dogfood artifact cites (`git cat-file -e <sha>`), and -50 diffs
          #     `argus/` between that sha and HEAD. In a shallow clone the sha is not a commit
          #     in the repository at all, so both report a fabricated staleness;
          #   * -52 generates its adversarial set from `git rev-list HEAD` and refuses to run
          #     on fewer than ten commits — correctly, since one commit proves nothing;
          #   * tests/test_pipeline_split_surface.py -15 asserts the pinned pre-split blob's
          #     commit is an ancestor of HEAD.
          #
          # `.github/workflows/argus-student-audit.yml` and `release.yml` already take full
          # history for the same class of reason. Do NOT answer a red from these guards by
          # loosening them: a history question needs the history.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # `[languages]` is NOT optional here even though it is optional for a consumer:
          # tests/test_multilanguage_audit.py asserts non-Python files reach `audited_deep`,
          # which is unreachable without the matching tree-sitter grammar. A bare `.[dev]`
          # install turns the multi-language claim into two red tests for an environment
          # reason rather than a defect.
          #
          # `[dev]` also carries `build` + `flit_core` as of 2026-08-16 (CI run 31895158449).
          # Without them `tests/test_built_distribution.py` could not build the artifact it
          # measures, so it SKIPPED every guard on every CI run — and `-24`, which refuses to
          # let that skip become the normal path, was red. Nothing to add here: the extra
          # declares the tooling, so this line acquires it.
          pip install .[dev,languages]
          # radon is already a RUNTIME dependency (the breadth detector calls its API),
          # so it arrives with the package — installing it again here only obscured
          # that. bandit + vulture are audit-only and are both actually RUN below;
          # installing a tool the pipeline never invokes is gate theatre.
          pip install bandit vulture

      - name: Run Static Analysis & Security Scans
        run: |
          echo "=== MYPY TYPE CHECK (blocking) ==="
          mypy argus

          # BANDIT, in two parts, because the previous single invocation was a gate
          # that could never pass. `bandit -r argus` exits 1 when it finds an issue at
          # ANY severity, and this tree legitimately carries 18 LOW findings: B404/
          # B603/B607 (the `git` subprocess calls `intake/source_state` is built on)
          # and B105 (constants named `token`/`secret` that hold rule ids, not
          # credentials). So the step failed on every run, before pytest was ever
          # reached — CI was red on master and the whole suite went unexecuted.
          #
          # The fix is a threshold, not a suppression: MEDIUM-and-above still fails
          # the build, and the full LOW-inclusive scan is printed for review. A real
          # Medium/High finding blocks exactly as intended.
          echo "=== BANDIT SECURITY SCAN (informational, all severities) ==="
          bandit -r argus -f txt --exit-zero
          echo "=== BANDIT SECURITY GATE (blocking at MEDIUM and above) ==="
          bandit -r argus -f txt --severity-level medium

          # Dead-code report. vulture was installed by this workflow and then never
          # invoked, so the orphaned modules it detects went unreported. Advisory
          # (`|| true`): its name-based analysis has known false positives on Pydantic
          # field declarations, so it informs review rather than blocking the build.
          echo "=== VULTURE DEAD-CODE REPORT (advisory) ==="
          vulture argus --min-confidence 80 || true

      - name: Run Pytest & Coverage Assurance Gate
        env:
          # A grammar-gated test that SKIPS in CI is a false green: the multi-language
          # claim would go unasserted while the run stayed green. This flag turns every
          # such skip into a hard failure, so a broken grammar install shows up as red.
          ARGUS_REQUIRE_LANGUAGE_GRAMMARS: "1"
        run: |
          # Prove the coverage gate CAN run before trusting that it DID. `pytest-cov`
          # was absent from the `[dev]` extra while this step passed `--cov`, so pytest
          # aborted with "unrecognized arguments" — the 80% coverage gate, the
          # project's headline quality claim, had never once been enforced on master.
          # An assertion that names the cause beats an opaque argument-parsing error.
          python -c "import pytest_cov" || {
            echo "::error::pytest-cov is not installed — the --cov-fail-under gate cannot run. Add it to the [dev] extra in pyproject.toml."
            exit 1
          }
          pytest --cov=argus --cov-report=term-missing --cov-report=xml --cov-fail-under=80
