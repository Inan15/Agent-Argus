# ArgusAgent release workflow — Story 9.2 / AC2, AC5 (epics IN-0, boundary B10).
#
# STATUS, STATED PLAINLY — UPDATED 2026-08-29:
# this workflow has executed, and it has never succeeded.
# Four runs, every one on tag `v1.0.0`, every one `failure`, all under twenty
# seconds: 33180657062, 33184222319, 33184399896, 33185012952 (2026-08-28). They failed in
# the preflight, correctly, on two enumerated edge cases:
#   [E5] tag 'v1.0.0' declares version '1.0.0' but pyproject.toml states '0.1.0'
#   [E4] a release already exists for tag 'v1.0.0'
# Two consequences worth stating rather than leaving to be inferred. First: the v1.0.0
# Release on this repository was NOT produced by this workflow — its artifacts reached the
# release page by another route, and the gated path has still never completed. Second: E5 is
# fixed in this change (`pyproject.toml` and `argus.__version__` both now state `1.0.0`),
# while E4 stands until an operator removes the existing release — and it is SUPPOSED to
# stand. Refusing to overwrite artifacts a consumer may already have resolved is the guard
# doing its job, not an obstacle to route around.
#
# ~~Superseded, kept on the record (§3.4): "this workflow is COMMITTED AND HAS NEVER
# EXECUTED. It was added on the `fix/honest-verdict-reporting` branch and no tag exists in
# this repository (`git tag -l` was empty when it was written), so there is no Actions run id
# and no release URL to cite."~~ True when written; falsified by the tag push. Note what the
# struck sentence leaned on — `git tag -l`, a LOCAL read, empty in any clone that has not
# fetched tags. That is the same weak oracle that let `TC-ArgusAgent-DOCS-001-55` pass on
# developer machines while CI went red on every push for six days.
#
# Nothing in this repository — README, CHANGELOG, story record or
# workflow output — may state or imply that a release has been published until a URL or
# an Actions run id can be cited as evidence (Story 9.2 / D2 / D13). The build itself was
# proven LOCALLY instead; the sdist/wheel filenames and their full file listings are
# recorded in the story's Dev Agent Record.
#
# WHAT IT DOES: on a `v*.*.*` tag (or a manual dispatch), it validates the tag, runs the
# enumerated release edge-case checks and refuses on any that fire, builds BOTH an sdist
# and a wheel with `python -m build`, refuses again if the build came out partial, and
# attaches both artifacts to a GitHub Release for that tag.
#
# WHAT THE ENUMERATION DOES AND DOES NOT COVER HERE, stated rather than implied: E1, E3,
# E4 and E5 run on this path; **E2 is not reachable from this workflow** (neither trigger
# creates a tag) and is a local-tooling guard, which the preflight prints next to it and
# `CI_UNREACHABLE` in scripts/release_preflight.py records. E4 needs `GH_TOKEN` to observe
# the published-release list; when it cannot, the report prints `UNKNOWN` for it and says
# it is not a clearance — it never prints `ok` for a question it could not put.
#
# WHAT IT DELIBERATELY DOES NOT DO: publish to PyPI or any other package index. That is
# an IRREVERSIBLE act (a released version can never be replaced), it needs a credential
# this repository cannot prove exists, and it is an operator decision taken with
# credentials in hand — not a decision a story author may take unilaterally. The exit
# path to an index is written down in CHANGELOG.md so the interim VCS pin has a named
# end rather than becoming permanent by silence.
#
# PERMISSIONS: `contents: write` and nothing else. Attaching artifacts to a GitHub
# Release needs no external credential, which is exactly why it was chosen over an index
# as the reversible option. No secret is referenced by this file.
#
# NFR-S1/S3 CONTAINMENT: a workflow log is a NEW publication surface. Nothing here echoes
# a token, a secret, or an absolute host path; the preflight prints relative paths, tags
# and versions only.
#
# UNTRUSTED INPUT: `workflow_dispatch.inputs.tag` is free-form (only the tag-PUSH trigger
# is constrained by the `v[0-9]+.[0-9]+.[0-9]+` filter). A `${{ }}` expression is expanded
# by the runner INTO THE SHELL SOURCE TEXT before bash parses it, so interpolating that
# input directly into a `run:` body on a job holding `contents: write` is GitHub's
# documented script-injection anti-pattern. Two rules are applied here and must not be
# relaxed: (1) every untrusted value is bound through `env:` and referenced as a quoted
# shell variable, never interpolated into the script body; (2) the value is validated
# against `release_preflight._VERSION_TAG` (`^v\d+\.\d+\.\d+$`) in the FIRST step that
# touches it, before it reaches any other command.
#
# THIRD-PARTY ACTIONS are pinned to full commit SHAs, not to mutable major tags: a moved
# `v4` silently changes what executes inside a job that can write to this repository. Each
# SHA below was resolved from the GitHub API on 2026-08-09 and is annotated with the
# semver tag that pointed at it; re-verify before bumping.

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release, e.g. v0.1.0 (must already exist and point at the commit you dispatch from)."
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish a GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout at the tag (full history + tags)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The preflight resolves the tag's commit and compares it against the checkout
          # (E3), so a shallow, tag-less checkout would make that check structurally
          # unable to fire. (E2 reads the tag list too, but E2 is not reachable from this
          # workflow at all — see CI_UNREACHABLE in scripts/release_preflight.py.)
          fetch-depth: 0
          fetch-tags: true
          # An ACTION input, not shell source: `actions/checkout` passes this to git as an
          # argument, so it is not an injection surface. It is still validated below
          # before any `run:` step is allowed to see it.
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # The wheel is pure Python and version-agnostic; the interpreter that builds it
          # does not appear in the artifact. 3.11 matches action.yml; the package itself
          # declares requires-python = ">=3.10" and audit-ci.yml matrixes 3.10/3.11/3.12.
          python-version: "3.11"

      - name: Validate the untrusted tag, then resolve it
        id: resolve
        # FIRST step that touches the value. The tag is bound through `env:` (never
        # interpolated into this script body) and validated against the single
        # `^v\d+\.\d+\.\d+$` pattern in release_preflight before it reaches any other
        # command; the step aborts non-zero on a bad shape, so nothing downstream — not
        # $GITHUB_OUTPUT, not the preflight, not `gh` — ever sees an unvalidated value.
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          python scripts/release_preflight.py --phase validate-tag --tag "$TAG"
          printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"
          printf 'Releasing tag: %s\n' "$TAG"

      - name: Preflight — refuse every enumerated release edge case (E1-E5)
        # The enumeration lives in ONE named place: RELEASE_EDGE_CASE_IDS in
        # scripts/release_preflight.py. A committed test asserts every member has a
        # handler and fails when a member is added without one, so this step cannot
        # silently stop covering a case. Run BEFORE the build so a refusal costs nothing.
        #
        # GH_TOKEN is required here, not decorative: without it `gh release list` exits on
        # authentication, E4 cannot observe whether the tag already has a release, and the
        # report prints UNKNOWN for it. A guard that cannot observe is not a guard, and an
        # `ok` it could not establish would be an unsupported claim in a publication
        # surface. The token is the automatic `github.token` — no repository secret.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: python scripts/release_preflight.py --phase pre-build --tag "$TAG"

      - name: Install the build front end
        # `python -m build` is the neutral front end: it reads [build-system] requires and
        # provisions flit_core in an isolated environment, producing BOTH artifacts from
        # one invocation — which is what E6 (refuse a partial release) is written against.
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - name: Preflight — refuse a partial build (E6)
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: python scripts/release_preflight.py --phase post-build --tag "$TAG" --dist-dir dist

      - name: Record what was built
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          printf 'Artifacts built for %s:\n' "$TAG"
          ls -l dist

      - name: Upload the artifacts to the workflow run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: argus-agent-${{ steps.resolve.outputs.tag }}-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 90

      - name: Generate the release note body (it types no fact)
        # CORRECTED 2026-08-15 by Story 12.9 / AC3. This step used to be a hand-typed
        # string literal inside the `gh release create` script below, and that literal
        # transcribed THREE pinned facts — the AR3 exit-code contract, the install command
        # and a PARAPHRASE of the FR34 disclosure. Story 12.8 changed what exit `2` can
        # mean and the literal did not move, because nothing could see it:
        # `_RELEASE_SURFACES` puts this file inside `-17`'s OVER-claim scan, and no guard
        # checked whether what it said was TRUE.
        #
        # Every claim in the body is now DERIVED by `scripts/release_notes.py` from the one
        # source of each fact — the version from pyproject.toml, the exit-code map from
        # `argus/verdict/verdict_gate.py` plus `argus/cli.py`'s reserved code, the FR34
        # disclosure from `argus/verdict/negative_assurance.py` in its canonical form, the
        # install command from the tag, and the RELEASE STATUS from the single derivation
        # that either cites a sha-scoped executed gate or records NOT ESTABLISHED
        # (architecture.md §H / Story 10.1). `tests/test_release_note_body.py` renders this
        # body and asserts each claim against the live constants in both directions.
        #
        # The generator is stdlib-only and does NOT import `argus`, exactly like
        # `release_preflight.py`: it runs on a bare runner and must not depend on a
        # successful install of the thing being released (Story 12.9 / DN-4).
        #
        # `$TAG` stays bound through `env:` and quoted — never interpolated into this body.
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          python scripts/release_notes.py --tag "$TAG" --out release-note.md
          cat release-note.md

      - name: Create the GitHub Release and attach both artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          # `--verify-tag` refuses to invent a tag that does not exist, and `gh release
          # create` fails rather than overwriting an existing release — the same refusal
          # E2/E4 already made, enforced a second time by the tool that does the writing.
          #
          # The release notes deliberately claim NOTHING about assurance. Argus's own
          # dogfood run is a SELF-audit (Argus auditing Argus) and is materially weaker
          # evidence than an independent-repository run; it is never presented as
          # external validation and the >=80%-precision gate remains PROVISIONAL, cleared
          # only by a human TP/FP adjudication that has not taken place (Story 9.2 /
          # AC12, SD-2). That sentence is now rendered BY the generator above from the
          # single-sourced disclosure constant rather than paraphrased here.
          gh release create "$TAG" \
            --title "argus-agent $TAG" \
            --verify-tag \
            --notes-file release-note.md \
            dist/*
