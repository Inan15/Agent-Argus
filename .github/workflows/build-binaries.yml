# Standalone binary builds — Windows, macOS and Linux.
#
# STATUS, STATED PLAINLY: this workflow builds and smoke-tests standalone executables. It
# does NOT create a tag and does NOT create a GitHub Release; it attaches packages to a
# release that already exists, and never touches `release.yml`'s tag-triggered path.
#
# WHY IT EXISTS: PyInstaller cannot cross-compile. A macOS binary needs a macOS runner and a
# Linux binary needs a Linux one, so the only way to ship all three from one place is a
# matrix. The 2026-08-17 Windows beta was built on a developer machine, which is exactly the
# single-platform limitation this removes.
#
# WHERE THE ARTIFACTS GO: each job uploads a workflow artifact. If `release_tag` is supplied,
# the packages are additionally attached to that tag in `releases_repo`.
#
# 🔧 CHANGED 2026-08-29. Publishing into THIS repository needs no secret: the built-in
# `github.token` carries the `contents: write` declared below. `RELEASES_REPO_TOKEN` is now
# OPTIONAL and needed only to publish into a DIFFERENT repository, which `github.token`
# cannot reach. Previously the secret was mandatory for any publish, so an unset secret
# meant a green run that shipped nothing — see the guard in `Attach to the public release`.

name: Build standalone binaries

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag of an existing release to attach the packages to (e.g. v1.0.0). Leave empty to build artifacts only."
        required: false
        default: ""
      releases_repo:
        description: "Repository holding that release. Defaults to this one; anything else needs RELEASES_REPO_TOKEN."
        required: false
        default: "Inan15/Agent-Argus"

# `contents: write` so `github.token` can attach assets to a release in this repository.
# Nothing else is granted, and no job creates or moves a tag.
permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            binary: argus.exe
          - os: macos-latest
            label: macos-arm64
            binary: argus
          - os: ubuntu-latest
            label: linux-x64
            binary: argus

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the project and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install pyinstaller

      - name: Write the launcher
        shell: bash
        run: |
          cat > argus_launcher.py <<'PY'
          import sys
          from argus.cli import main
          if __name__ == "__main__":
              sys.exit(main())
          PY

      - name: Build the executable
        shell: bash
        run: |
          pyinstaller --onefile --name argus --clean --noconfirm --log-level WARN \
            --collect-all tree_sitter \
            --collect-all tree_sitter_python --collect-all tree_sitter_javascript \
            --collect-all tree_sitter_typescript --collect-all tree_sitter_go \
            --collect-all tree_sitter_rust --collect-all tree_sitter_java \
            --collect-all tree_sitter_c --collect-all tree_sitter_cpp \
            --collect-all tree_sitter_ruby --collect-all tree_sitter_php \
            --collect-all argus --hidden-import argus.cli \
            argus_launcher.py

      # A build that produces a file nobody ran is not a build. Each platform proves the
      # binary starts AND completes a real audit to a verdict before it is packaged.
      - name: Smoke-test the binary
        shell: bash
        env:
          BINARY: ${{ matrix.binary }}
        run: |
          BIN="dist/$BINARY"
          test -f "$BIN" || { echo "::error::no binary at $BIN"; exit 1; }
          "$BIN" --help > /dev/null || { echo "::error::--help failed"; exit 1; }

          mkdir -p smoke/tests
          cat > smoke/calculator.py <<'PY'
          def add(a, b):
              return a + b
          PY
          cat > smoke/tests/test_calculator.py <<'PY'
          import unittest
          from calculator import add

          class T(unittest.TestCase):
              def test_add(self):
                  self.assertEqual(add(2, 3), 5)
          PY
          git -C smoke init -q .
          git -C smoke add -A
          git -C smoke -c user.email=ci@example.com -c user.name=ci commit -qm smoke

          # 2>&1 is load-bearing: the instrument notice is written to STDERR (the `argus:`
          # prefixed lines), so capturing stdout alone silently drops the very thing this
          # step exists to prove is present. Measured on the first CI dispatch, where all
          # three platforms built and audited correctly and this check still failed.
          "$BIN" audit smoke 2>&1 | tee audit.txt
          grep -q "verdict=" audit.txt || { echo "::error::no verdict emitted"; exit 1; }
          grep -qi "precision" audit.txt || { echo "::error::instrument notice absent"; exit 1; }

      # 🔧 ADDED 2026-08-29. The package name was the literal `argus-agent-0.1.0-beta-*`
      # in four places. It did not track `pyproject.toml`, so after the version moved to
      # 1.0.0 this workflow built the 1.0.0 tree and named every artifact `0.1.0-beta` —
      # a binary that misreports its own version, from the workflow that produces the
      # front-door download. Derived here so the two cannot disagree again.
      - name: Derive the packaged version
        id: ver
        shell: bash
        run: |
          VERSION="$(python -c "import re,pathlib; print(re.search(r'^version\s*=\s*\"([^\"]+)\"', pathlib.Path('pyproject.toml').read_text(encoding='utf-8'), re.M).group(1))")"
          if [ -z "$VERSION" ]; then echo "::error::could not read version from pyproject.toml"; exit 1; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Packaged version: $VERSION"

      - name: Assemble the package
        shell: bash
        env:
          BINARY: ${{ matrix.binary }}
          LABEL: ${{ matrix.label }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          NAME="argus-agent-$VERSION-$LABEL"
          mkdir -p "$NAME"
          cp "dist/$BINARY" "$NAME/"
          cp packaging/QUICKSTART.md packaging/FEEDBACK.md "$NAME/"
          # 🔧 CHANGED 2026-08-29. The package used to ship `packaging/LICENSE.txt`, a
          # proprietary "Beta Evaluation Licence" opening "This is NOT open-source software"
          # — inside binaries built from a repository whose root LICENSE is MIT. A second
          # copy of a licence is a licence that drifts, and this one drifted into
          # contradicting the first. There is now ONE licence file; the package carries a
          # copy of it, renamed only for the .txt convention consumers expect.
          cp LICENSE "$NAME/LICENSE.txt"
          python packaging/generate_third_party_notices.py > "$NAME/THIRD-PARTY-NOTICES.txt"
          cd "$NAME"
          if command -v sha256sum > /dev/null; then
            sha256sum "$BINARY" > SHA256SUMS.txt
          else
            shasum -a 256 "$BINARY" > SHA256SUMS.txt
          fi
          cat SHA256SUMS.txt
          cd ..
          python -c "
          import shutil, sys
          shutil.make_archive(sys.argv[1], 'zip', '.', sys.argv[1])
          " "$NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: argus-agent-${{ steps.ver.outputs.version }}-${{ matrix.label }}
          path: argus-agent-${{ steps.ver.outputs.version }}-${{ matrix.label }}.zip
          if-no-files-found: error

      # Publishing is OPT-IN and needs BOTH a tag and a token. Absent either, the workflow
      # has still built and proven three binaries and simply stops short of going outward.
      - name: Attach to the public release
        if: ${{ inputs.release_tag != '' }}
        shell: bash
        # `release_tag` and `releases_repo` are OPERATOR-SUPPLIED. They are bound through
        # `env:` and referenced as double-quoted shell variables so the runner never
        # substitutes them into the script text — the `DF-9-2-D` defect, where an
        # interpolated value is code rather than data. Same containment as `release.yml`.
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN || github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASES_REPO: ${{ inputs.releases_repo }}
          ASSET: argus-agent-${{ steps.ver.outputs.version }}-${{ matrix.label }}.zip
        run: |
          # Unreachable in normal Actions runs since `github.token` always exists. It fails
          # LOUDLY rather than warning: a publish that silently does not happen is
          # indistinguishable from one that did, which is the defect this replaced.
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::no token available — built and verified, but NOT published."
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "$ASSET" --repo "$RELEASES_REPO" --clobber
