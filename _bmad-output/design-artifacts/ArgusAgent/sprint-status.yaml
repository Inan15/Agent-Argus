  12-6-coding-agent-can-run-audit-and-read-verdict: backlog  # FR35 · 🟠 · Engineering Lead. MCP server, STDIO ONLY, as an entry point in the SAME distribution (inherits release workflow, version, gate evidence — not a separate channel). No network listener, no bound port, no HTTP stack, no credentials (--deep reads its credential through the existing adapter's env contract, never through this surface). argus.* ⊬ fastapi and ADR #20 hold unchanged. ADAPTER LAYER ONLY: same AuditRequest -> AuditVerdict as the CLI, dependency arrow inward. VERDICT PARITY pinned by test. Carries the FR34 disclosure.
