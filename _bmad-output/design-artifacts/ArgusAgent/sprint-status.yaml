  12-8-the-tool-explains-itself: backlog  # 🟡 · Engineering. docs/ holds ONE integrator-shaped README. Lean first-run page: install, first audit, reading the ledger, what each verdict means — NO tutorial prose beyond that (this persona is a developer, not a novice). --help states purpose + default for every flag 10.3 blessed, with a parser-vs-help parity test alongside 10.3's parser-vs-contract test. Operator errors (bad path, unreadable repo, missing grammar, absent key under --deep) name CAUSE and FIX — extends 10.4's diagnosis principle to the user surface. ABSORBS DF-8-4-D (2026-08-10b triage, RELEASE-RELEVANT): cli.py:295-299 catches BASE ValueError while its comment names five typed subclasses, and Pydantic ValidationError IS a ValueError subclass — an internal defect surfaces as an expected 'audit failed' degradation. Split the arms; pin both directions. Filed as low severity when every user could read a stack trace; not low for a public CLI (a masked bug costs the user a next action, which FR37 forbids, and costs the maintainer the bug report).
